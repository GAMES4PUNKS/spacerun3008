<body>
<div style="position:relative;">
  <canvas id="gameCanvas" tabindex="0" aria-label="Snake game"></canvas>
  <div id="overlay"></div>
</div>

<!-- D-pad and rest of markup unchanged ... -->

<audio id="radioStream" loop>
  <source src="http://stream.radiojar.com/2qm1fc5kb" type="audio/mpeg">
</audio>
<audio id="explosionSound" src="explosion.mp3"></audio>
<audio id="crashSound" src="crash.mp3"></audio>
<audio id="spaceshipSound" src="spaceship.mp3"></audio>
<audio id="alienSound" src="alien.mp3"></audio>

<script>
  // ...variables from your previous code...

  // Add new audio
  const spaceshipSound = document.getElementById("spaceshipSound");
  const alienSound = document.getElementById("alienSound");
  spaceshipSound.volume = 0.5;
  alienSound.volume = 0.5;

  // --- SPECIAL APPLE (spaceship & alien) STATE ---
  let specialApples = {
    spaceship: null, // {x, y, visible, timeoutId}
    alien: null      // {x, y, visible, timeoutId}
  };

  // Helper to get free positions
  function getFreeCell() {
    let tries = 0;
    while (tries < 1000) {
      let x = Math.floor(Math.random() * tileCount);
      let y = Math.floor(Math.random() * tileCount);
      // Not on snake or other apples
      if (
        !snake.some(seg => seg.x === x && seg.y === y) &&
        !(apple.x === x && apple.y === y) &&
        (!specialApples.spaceship || !(specialApples.spaceship.x === x && specialApples.spaceship.y === y)) &&
        (!specialApples.alien || !(specialApples.alien.x === x && specialApples.alien.y === y))
      ) return {x, y};
      tries++;
    }
    // Fallback to (0,0)
    return {x: 0, y: 0};
  }

  // --- SPECIAL APPLE TIMERS ---
  let spaceshipAppearTimer = null, alienAppearTimer = null;

  function triggerSpaceshipApple() {
    if (specialApples.spaceship) return; // Already present
    const pos = getFreeCell();
    specialApples.spaceship = {
      x: pos.x,
      y: pos.y,
      visible: true,
      timeoutId: setTimeout(() => {
        specialApples.spaceship = null;
        scheduleSpaceshipApple();
      }, 6000)
    };
  }

  function triggerAlienApple() {
    if (specialApples.alien) return; // Already present
    const pos = getFreeCell();
    specialApples.alien = {
      x: pos.x,
      y: pos.y,
      visible: true,
      timeoutId: setTimeout(() => {
        specialApples.alien = null;
        scheduleAlienApple();
      }, 6000)
    };
  }

  function scheduleSpaceshipApple() {
    // Spaceship appears every 7-14 seconds after previous disappears
    spaceshipAppearTimer = setTimeout(triggerSpaceshipApple, 7000 + Math.random()*7000);
  }
  function scheduleAlienApple() {
    // Alien appears every 30-70 seconds after previous disappears (less often)
    alienAppearTimer = setTimeout(triggerAlienApple, 30000 + Math.random()*40000);
  }

  function clearSpecialApples() {
    if (specialApples.spaceship && specialApples.spaceship.timeoutId)
      clearTimeout(specialApples.spaceship.timeoutId);
    if (specialApples.alien && specialApples.alien.timeoutId)
      clearTimeout(specialApples.alien.timeoutId);
    if (spaceshipAppearTimer) clearTimeout(spaceshipAppearTimer);
    if (alienAppearTimer) clearTimeout(alienAppearTimer);
    specialApples.spaceship = null;
    specialApples.alien = null;
    spaceshipAppearTimer = null;
    alienAppearTimer = null;
  }

  // --- GAME RESET OVERRIDE ---
  function resetGame() {
    snake = [{ x: 10, y: 10 }];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    apple = { x: 5, y: 5 };
    score = 0;
    started = false;
    gameOverFlag = false;
    paused = false;
    updateHud();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    gameStatusLine.style.display = "none";
    statusBar.style.display = "block";
    hideOverlay();
    clearInterval(gameInterval);
    // --- SPECIAL APPLE RESET ---
    clearSpecialApples();
    scheduleSpaceshipApple();
    scheduleAlienApple();
    gameInterval = setInterval(gameLoop, speed);
    setTimeout(() => canvas.focus(), 100);
  }

  // --- GAME LOOP MODIFICATION ---
  function gameLoop() {
    if (!started || gameOverFlag || paused) return;
    direction = { ...nextDirection };

    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Collision check
    if (
      head.x < 0 || head.x >= tileCount ||
      head.y < 0 || head.y >= tileCount ||
      snake.some(seg => seg.x === head.x && seg.y === head.y)
    ) {
      if (!sfxMuted) {
        crashSound.currentTime = 0;
        crashSound.play();
      }
      gameOver();
      return;
    }
    snake.unshift(head);

    // --- APPLE COLLISIONS ---
    let ate = false;

    // Normal apple
    if (head.x === apple.x && head.y === apple.y) {
      score++;
      ate = true;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('spacerun_highscore', highScore);
      }
      if (!sfxMuted) {
        explosionSound.currentTime = 0;
        explosionSound.play();
      }
      // Place apple not on snake or specials
      do {
        apple = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (
        snake.some(seg => seg.x === apple.x && seg.y === apple.y) ||
        (specialApples.spaceship && specialApples.spaceship.x === apple.x && specialApples.spaceship.y === apple.y) ||
        (specialApples.alien && specialApples.alien.x === apple.x && specialApples.alien.y === apple.y)
      );
    }

    // Spaceship apple
    if (specialApples.spaceship && head.x === specialApples.spaceship.x && head.y === specialApples.spaceship.y) {
      score += 10;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('spacerun_highscore', highScore);
      }
      if (!sfxMuted) {
        spaceshipSound.currentTime = 0;
        spaceshipSound.play();
      }
      clearTimeout(specialApples.spaceship.timeoutId);
      specialApples.spaceship = null;
      scheduleSpaceshipApple();
      ate = true;
    }

    // Alien apple
    if (specialApples.alien && head.x === specialApples.alien.x && head.y === specialApples.alien.y) {
      score += 20;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('spacerun_highscore', highScore);
      }
      if (!sfxMuted) {
        alienSound.currentTime = 0;
        alienSound.play();
      }
      clearTimeout(specialApples.alien.timeoutId);
      specialApples.alien = null;
      scheduleAlienApple();
      ate = true;
    }

    if (!ate) {
      snake.pop();
    }
    updateHud();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${gridSize}px Orbitron`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    // Draw snake: head is not flickering, rest flicker
    snake.forEach((seg, i) => {
      ctx.save();
      if (i === 0) {
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = Math.abs(Math.sin((Date.now() + i * 100) / 30));
      }
      ctx.fillText("✨", seg.x * gridSize + gridSize / 2, seg.y * gridSize + gridSize / 2);
      ctx.restore();
    });
    // Draw apple (normal)
    ctx.save();
    ctx.globalAlpha = Math.abs(Math.sin(Date.now() / 30));
    ctx.fillText("👾", apple.x * gridSize + gridSize / 2, apple.y * gridSize + gridSize / 2);
    ctx.restore();

    // Draw spaceship apple if present and visible
    if (specialApples.spaceship && specialApples.spaceship.visible) {
      ctx.save();
      ctx.globalAlpha = Math.abs(Math.sin(Date.now() / 30));
      ctx.fillText("🛸", specialApples.spaceship.x * gridSize + gridSize / 2, specialApples.spaceship.y * gridSize + gridSize / 2);
      ctx.restore();
    }
    // Draw alien apple if present and visible
    if (specialApples.alien && specialApples.alien.visible) {
      ctx.save();
      ctx.globalAlpha = Math.abs(Math.sin(Date.now() / 30));
      ctx.fillText("👽", specialApples.alien.x * gridSize + gridSize / 2, specialApples.alien.y * gridSize + gridSize / 2);
      ctx.restore();
    }
  }

  // --- UNCHANGED GAME CODE BELOW ---

  function gameOver() {
    clearInterval(gameInterval);
    finalScoreSpan.textContent = `Score: ${score}`;
    updateHud();
    statusBar.style.display = "none";
    gameStatusLine.style.display = "flex";
    gameOverFlag = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showOverlay("GAME OVER");
    setTimeout(hideOverlay, 1800);
    clearSpecialApples();
  }

  document.addEventListener("keydown", e => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(e.key)) {
      if (e.key === "ArrowUp" || e.key === "w") setDirection({ x: 0, y: -1 });
      if (e.key === "ArrowDown" || e.key === "s") setDirection({ x: 0, y: 1 });
      if (e.key === "ArrowLeft" || e.key === "a") setDirection({ x: -1, y: 0 });
      if (e.key === "ArrowRight" || e.key === "d") setDirection({ x: 1, y: 0 });
      canvas.focus();
    }
    // Pause/resume
    if (e.key.toLowerCase() === "p") {
      togglePause();
    }
    // Restart on Enter after game over
    if (gameOverFlag && e.key === "Enter") {
      resetGame();
    }
  });

  // Touch swipe support and rest of code unchanged...

  // D-pad controls (controller cross)
  upBtn.onclick = e => setDirection({ x: 0, y: -1 });
  downBtn.onclick = e => setDirection({ x: 0, y: 1 });
  leftBtn.onclick = e => setDirection({ x: -1, y: 0 });
  rightBtn.onclick = e => setDirection({ x: 1, y: 0 });
  pauseDpadBtn.onclick = togglePause;
  pauseBtn.onclick = togglePause;

  function togglePause() {
    if (gameOverFlag) return;
    paused = !paused;
    pauseBtn.innerHTML = paused ? "▶️" : "⏸️";
    pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
    pauseDpadBtn.innerHTML = paused ? "▶️" : "⏯️";
    if (paused) {
      showOverlay("PAUSED");
    } else {
      hideOverlay();
    }
  }

  restartBtn.onclick = resetGame;

  toggleRadioBtn.onclick = () => {
    if (radio.paused) {
      radio.play();
      toggleRadioBtn.textContent = "Radio OFF";
      toggleRadioBtn.setAttribute("aria-pressed", "true");
    } else {
      radio.pause();
      toggleRadioBtn.textContent = "Radio ON";
      toggleRadioBtn.setAttribute("aria-pressed", "false");
    }
  };

  // SFX mute/unmute
  muteBtn.onclick = () => {
    sfxMuted = !sfxMuted;
    muteBtn.textContent = sfxMuted ? "🔇" : "🔊";
    muteBtn.setAttribute("aria-pressed", sfxMuted ? "true" : "false");
  };

  // Speed select
  speedSelect.value = speed + '';
  speedSelect.onchange = () => {
    speed = Number(speedSelect.value);
    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, speed);
  };

  // Focus canvas on click
  canvas.onclick = () => canvas.focus();

  // Responsive canvas resizing
  function resizeCanvas() {
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // Show overlay if paused when focus returns
  window.addEventListener('focus', () => {
    if (paused && lastOverlayMsg !== "PAUSED") showOverlay("PAUSED");
  });

  // Initial setup
  updateHud();
  resetGame();
</script>
</body>
</html>
