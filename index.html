<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPACERUN3008 – Listen & Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url('bgobe.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    canvas {
      width: 90vmin;
      height: 90vmin;
      max-width: 90vw;
      max-height: 90vw;
      background: url('moshed-2021-11-29-0-39-58.gif') center/cover no-repeat;
      display: block;
      box-shadow: 0 0 20px #a020f0;
      margin: 1rem auto 0 auto;
      outline: none;
      position: relative;
      z-index: 1;
    }
    #touchpad {
      width: 90vmin;
      max-width: 90vw;
      height: 20vmin;
      max-height: 120px;
      margin: 1.5rem auto 0 auto;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 2px solid #a020f0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 1px;
      user-select: none;
      touch-action: none;
      transition: background 0.2s;
    }
    #touchpad.active {
      background: rgba(160,32,240,0.22);
    }
    #statusBar {
      font-size: 1rem;
      color: white;
      margin-bottom: 0.5rem;
      z-index: 3;
    }
    #scoreDisplay {
      font-size: 1.2rem;
      margin-right: 1.5rem;
    }
    #highScoreDisplay {
      font-size: 1.2rem;
      margin-left: 1.5rem;
      color: #a0ffd0;
    }
    #gameStatusLine {
      display: none;
      margin-top: 0.5rem;
      font-size: 1rem;
      color: white;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      z-index: 4;
      position: relative;
    }
    #finalScore {
      margin: 0 0.3rem;
      color: white;
    }
    #restartBtn, #toggleRadio, #loginBtn, #pauseBtn, #muteBtn {
      background: none;
      font-size: 1rem;
      font-family: 'Orbitron', sans-serif;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      animation: pulse 1.5s infinite ease-in-out;
      margin: 0 0.3rem;
    }

      border: 1px solid #a020f0;
