<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPACERUN3008 – Listen & Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url('bgobe.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #main-content {
      width: 100%;
    }
    canvas {
      width: 90vmin;
      height: 90vmin;
      max-width: 90vw;
      max-height: 90vw;
      background: url('moshed-2021-11-29-0-39-58.gif') center/cover no-repeat;
      display: block;
      box-shadow: 0 0 20px #a020f0;
      margin: 1rem auto;
      outline: none;
      position: relative;
      z-index: 1;
    }
    /* Status bar split for touch */
    #statusBarRow1,
    #statusBarRow2 {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.7em;
      flex-wrap: nowrap;
      overflow-x: auto;
      white-space: nowrap;
      width: 100%;
    }
    #statusBarRow1 {
      font-size: 1.1rem;
      margin-bottom: 0.15em;
    }
    #statusBarRow2 {
      font-size: 1.1rem;
      margin-bottom: 0.6em;
    }
    /* Desktop default: show combined bar, hide split bars */
    #statusBarCombined {
      display: flex;
      font-size: 1rem;
      color: white;
      margin-bottom: 0.7em;
      z-index: 3;
      justify-content: center;
      align-items: center;
      gap: 0.7em;
      flex-wrap: nowrap;
      overflow-x: auto;
      white-space: nowrap;
      width: 100%;
    }
    .show-dpad #statusBarCombined { display: none; }
    .show-dpad #statusBarRow1, .show-dpad #statusBarRow2 { display: flex; }
    #statusBarRow1, #statusBarRow2 { display: none; }
    /* Buttons and text styles (shared for both modes) */
    #statusBarCombined span, #statusBarRow1 span, #statusBarRow2 span {
      font-size: 1.1rem;
      margin: 0 0.6em;
      white-space: nowrap;
    }
    #statusBarCombined #highScoreDisplay,
    #statusBarRow1 #highScoreDisplayTouch {
      color: #a0ffd0;
    }
    #statusBarCombined button, #statusBarRow1 button, #statusBarRow2 button,
    #statusBarCombined select, #statusBarRow1 select, #statusBarRow2 select {
      background: none;
      font-size: 1rem;
      font-family: 'Orbitron', sans-serif;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      animation: pulse 1.5s infinite ease-in-out;
      margin: 0 0.3rem;
      outline: none;
    }
    #statusBarCombined select, #statusBarRow2 select {
      background: #181818;
      color: white;
      border-radius: 6px;
      border: 1px solid #a020f0;
      padding: 0.1rem 0.5rem;
      font-family: 'Orbitron', sans-serif;
      margin-left: 0.5rem;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }
    a.leaderboard-link {
      color: white;
      text-decoration: underline;
      font-size: 1rem;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.1; }
      100% { opacity: 1; }
    }
    #gameStatusLine {
      display: none;
      margin-top: 0.5rem;
      font-size: 1rem;
      color: white;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      z-index: 4;
      position: relative;
    }
    #finalScore {
      margin: 0 0.3rem;
      color: white;
    }
    #loginPopup {
      display: none;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      border: 1px solid #888;
      padding: 1rem;
      border-radius: 10px;
      color: white;
      z-index: 20;
      min-width: 250px;
    }
    #loginPopup button {
      margin: 0.5rem;
      font-size: 1rem;
      background: #333;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    #closeLoginPopup {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 18px;
      color: white;
      cursor: pointer;
    }
    #overlay {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      border-radius: 16px;
      font-size: 2rem;
      z-index: 5;
      padding: 2rem 3rem;
      pointer-events: none;
    }
    /* D-pad grid - only on touch devices */
    #dpad-area {
      display: none;
      width: 100%;
      justify-content: center;
      align-items: center;
      margin: 2em 0 1em 0;
    }
    .show-dpad #dpad-area {
      display: flex;
    }
    #dpad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1.1em;
    }
    .dpad-btn {
      width: 94px;
      height: 94px;
      background: rgba(32,32,32,0.7);
      border: 3px solid #a0ffd0;
      color: #fff;
      font-size: 2.7rem;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 0 18px #a0ffd080;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.15s, border 0.15s;
      opacity: 0.97;
      outline: none;
      backdrop-filter: blur(2px);
    }
    .dpad-btn:active {
      background: #a020f0cc;
      border: 3px solid #fff;
      opacity: 1;
    }
    @media (max-width: 650px) {
      .dpad-btn {
        width: 64px;
        height: 64px;
        font-size: 1.52rem;
      }
      #dpad-area { margin: 1.2em 0 0.8em 0; }
      #statusBarCombined, #statusBarRow1, #statusBarRow2 { font-size: 1.0rem; }
    }
    .visually-hidden {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px 1px 1px 1px);
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="main-content">
  <div style="position:relative;">
    <canvas id="gameCanvas" tabindex="0" aria-label="Snake game"></canvas>
    <div id="overlay"></div>
  </div>
  <!-- SECTION 1: Status bar for desktop (single line) -->
  <div id="statusBarCombined">
    <span id="scoreDisplay">Score: 0</span>
    <span id="highScoreDisplay">High Score: 0</span>
    <button id="pauseBtn" aria-pressed="false" title="Pause/Resume">⏸️</button>
    <button id="muteBtn" aria-pressed="false" title="Mute/Unmute SFX">🔊</button>
    <label for="speedSelect" class="visually-hidden">Game Speed</label>
    <select id="speedSelect" title="Game Speed">
      <option value="250">Normal</option>
      <option value="120">Fast</option>
      <option value="60">Turbo</option>
    </select>
    <button id="toggleRadio" aria-pressed="false">Radio ON</button>
    <button id="loginBtn">LOG IN</button>
  </div>
  <!-- SECTION 1: Status bar for touch (two lines, same design as desktop) -->
  <div id="statusBarRow1">
    <span id="scoreDisplayTouch">Score: 0</span>
    <span id="highScoreDisplayTouch">High Score: 0</span>
    <button id="pauseBtnTouch" aria-pressed="false" title="Pause/Resume">⏸️</button>
  </div>
  <div id="statusBarRow2">
    <button id="muteBtnTouch" aria-pressed="false" title="Mute/Unmute SFX">🔊</button>
    <label for="speedSelectTouch" class="visually-hidden">Game Speed</label>
    <select id="speedSelectTouch" title="Game Speed">
      <option value="250">Normal</option>
      <option value="120">Fast</option>
      <option value="60">Turbo</option>
    </select>
    <button id="toggleRadioTouch" aria-pressed="false">Radio ON</button>
    <button id="loginBtnTouch">LOG IN</button>
  </div>
  <div id="gameStatusLine" aria-live="polite">
    <span>Game over.</span>
    <span id="finalScore">Score: 0</span>
    <button id="restartBtn">Play Again</button>
    <a href="https://games4punks.github.io/spacerun3008/leaderboard.html" class="leaderboard-link" target="_blank" rel="noopener noreferrer">View Leaderboard</a>
  </div>
  <div id="loginPopup" aria-modal="true" role="dialog">
    <span id="closeLoginPopup" tabindex="0" aria-label="Close login popup">&times;</span>
    <p>Select WAX Wallet</p>
    <button onclick="alert('Login with Anchor')">Anchor</button>
    <button onclick="alert('Login with MyCloud')">MyCloud</button>
    <button onclick="alert('Login with Wombat')">Wombat</button>
  </div>
  <!-- SECTION 2: D-pad, only shows on touch devices -->
  <div id="dpad-area">
    <div id="dpad-grid">
      <button id="leftBtn"  class="dpad-btn" aria-label="Move Left">←</button>
      <button id="upBtn"    class="dpad-btn" aria-label="Move Up">↑</button>
      <button id="rightBtn" class="dpad-btn" aria-label="Move Right">→</button>
      <button id="downBtn"  class="dpad-btn" aria-label="Move Down">↓</button>
    </div>
  </div>
</div>
<audio id="radioStream" loop>
  <source src="http://stream.radiojar.com/2qm1fc5kb" type="audio/mpeg">
</audio>
<audio id="explosionSound" src="explosion.mp3"></audio>
<audio id="crashSound" src="crash.mp3"></audio>
<audio id="spaceshipSound" src="spaceship.mp3"></audio>
<audio id="alienSound" src="alien.mp3"></audio>
<audio id="rocketSound" src="rocket.mp3"></audio>
<audio id="satelliteSound" src="satellite.mp3"></audio>
<audio id="spacemanSound" src="spaceman.mp3"></audio>
<script>
window.onload = function() {
  function isTouchDevice() {
    return (
      'ontouchstart' in window ||
      (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) ||
      (navigator.msMaxTouchPoints && navigator.msMaxTouchPoints > 0)
    );
  }
  // Status bar element refs
  const statusBarCombined = document.getElementById("statusBarCombined");
  const statusBarRow1 = document.getElementById("statusBarRow1");
  const statusBarRow2 = document.getElementById("statusBarRow2");

  // Touch/desktop split
  if (isTouchDevice()) {
    document.body.classList.add('show-dpad');
    statusBarCombined.style.display = "none";
    statusBarRow1.style.display = "flex";
    statusBarRow2.style.display = "flex";
  } else {
    statusBarCombined.style.display = "flex";
    statusBarRow1.style.display = "none";
    statusBarRow2.style.display = "none";
  }

  // For game logic, use the correct controls depending on device:
  // PC: original IDs; TOUCH: ...Touch IDs
  function getEl(id) {
    if (isTouchDevice()) {
      // Map PC IDs to Touch IDs
      switch (id) {
        case "scoreDisplay": return document.getElementById("scoreDisplayTouch");
        case "highScoreDisplay": return document.getElementById("highScoreDisplayTouch");
        case "pauseBtn": return document.getElementById("pauseBtnTouch");
        case "muteBtn": return document.getElementById("muteBtnTouch");
        case "speedSelect": return document.getElementById("speedSelectTouch");
        case "toggleRadio": return document.getElementById("toggleRadioTouch");
        case "loginBtn": return document.getElementById("loginBtnTouch");
      }
    }
    return document.getElementById(id);
  }

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = 400;
  canvas.height = 400;

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;
  let snake = [{ x: 10, y: 10 }];
  let direction = { x: 0, y: 0 };
  let nextDirection = { x: 0, y: 0 };
  let score = 0;
  let highScore = Number(localStorage.getItem('spacerun_highscore') || "0");
  let started = false;
  let paused = false;
  let gameInterval, speed = 250;
  let gameOverFlag = false;
  let sfxMuted = false;
  let touchStartX, touchStartY;
  let lastOverlayMsg = "";

  const gameStatusLine = document.getElementById("gameStatusLine");
  const finalScoreSpan = document.getElementById("finalScore");
  const restartBtn = document.getElementById("restartBtn");
  const radio = document.getElementById("radioStream");
  const overlay = document.getElementById("overlay");
  const loginPopup = document.getElementById("loginPopup");
  const closeLoginPopup = document.getElementById("closeLoginPopup");

  // Touch/PC control ids
  const pauseBtn = getEl("pauseBtn");
  const muteBtn = getEl("muteBtn");
  const speedSelect = getEl("speedSelect");
  const toggleRadioBtn = getEl("toggleRadio");
  const loginBtn = getEl("loginBtn");
  const scoreDisplay = getEl("scoreDisplay");
  const highScoreDisplay = getEl("highScoreDisplay");

  // Radio, sound, login
  const explosionSound = document.getElementById("explosionSound");
  const crashSound = document.getElementById("crashSound");
  const spaceshipSound = document.getElementById("spaceshipSound");
  const alienSound = document.getElementById("alienSound");
  const rocketSound = document.getElementById("rocketSound");
  const satelliteSound = document.getElementById("satelliteSound");
  const spacemanSound = document.getElementById("spacemanSound");

  const upBtn = document.getElementById("upBtn");
  const downBtn = document.getElementById("downBtn");
  const leftBtn = document.getElementById("leftBtn");
  const rightBtn = document.getElementById("rightBtn");

  // Add login popup logic
  loginBtn.onclick = () => { loginPopup.style.display = "block"; }
  closeLoginPopup.onclick = () => { loginPopup.style.display = "none"; }
  window.addEventListener('keydown', function(e) {
    if (e.key === "Escape") loginPopup.style.display = "none";
  });

  explosionSound.volume = 0.5;
  crashSound.volume = 0.5;
  spaceshipSound.volume = 0.5;
  alienSound.volume = 0.5;
  rocketSound.volume = 0.5;
  satelliteSound.volume = 0.5;
  spacemanSound.volume = 0.5;

  // Apple configs for timing and points
  const appleConfigs = [
    { name: "invader", emoji: "👾", points: 25, minDelay: 5000, maxDelay: 12000 },
    { name: "alien", emoji: "👽", points: 20, minDelay: 16000, maxDelay: 30000 },
    { name: "spaceship", emoji: "🛸", points: 10, minDelay: 8000, maxDelay: 16000 },
    { name: "rocket", emoji: "🚀", points: 5, minDelay: 3000, maxDelay: 7000 },
    { name: "satellite", emoji: "🛰️", points: 3, minDelay: 2000, maxDelay: 5000 },
    { name: "spaceman", emoji: "🧑‍🚀", points: 0, minDelay: 2000, maxDelay: 8000 }
  ];

  let apples = {};
  appleConfigs.forEach(cfg => {
    apples[cfg.name] = {
      ...cfg,
      x: 0, y: 0,
      active: false,
      timer: null,
      visibleDuration: cfg.name === "spaceman" ? 2000 : null
    };
  });

  function getFreeCell() {
    let tries = 0;
    while (tries < 1000) {
      let x = Math.floor(Math.random() * tileCount);
      let y = Math.floor(Math.random() * tileCount);
      let clash = snake.some(seg => seg.x === x && seg.y === y) ||
        Object.values(apples).some(a => a.active && a.x === x && a.y === y);
      if (!clash) return {x, y};
      tries++;
    }
    return {x: 0, y: 0};
  }

  function spawnApple(name) {
    const apple = apples[name];
    const {x, y} = getFreeCell();
    apple.x = x;
    apple.y = y;
    apple.active = true;
    if (name === "spaceman") {
      if (apple.timer) clearTimeout(apple.timer);
      apple.timer = setTimeout(() => { apple.active = false; scheduleApple("spaceman"); }, apple.visibleDuration);
    } else if (name === "invader") {
      // Invader logic unchanged, handled by scheduleApple
    } else {
      // For all other apples, display for random time 2–7s
      if (apple.timer) clearTimeout(apple.timer);
      const visibleMs = 2000 + Math.random() * 5000; // 2s–7s
      apple.timer = setTimeout(() => {
        apple.active = false;
        scheduleApple(name);
      }, visibleMs);
    }
  }

  function scheduleApple(name) {
    const apple = apples[name];
    if (apple.timer) clearTimeout(apple.timer);
    let delay;
    if (name === "spaceman") {
      delay = apple.minDelay + Math.random() * (apple.maxDelay - apple.minDelay);
      apple.timer = setTimeout(() => spawnApple("spaceman"), delay);
    } else if (name === "invader") {
      delay = apple.minDelay + Math.random() * (apple.maxDelay - apple.minDelay);
      apple.timer = setTimeout(() => {
        if (apple.active) {
          const {x, y} = getFreeCell();
          apple.x = x;
          apple.y = y;
          scheduleApple("invader");
        }
      }, delay);
    } else {
      delay = apple.minDelay + Math.random() * (apple.maxDelay - apple.minDelay);
      apple.timer = setTimeout(() => spawnApple(name), delay);
    }
  }

  function resetApples() {
    Object.values(apples).forEach(apple => {
      apple.active = false;
      if (apple.timer) clearTimeout(apple.timer);
    });
    spawnApple("invader");
    scheduleApple("invader");
    ["alien","spaceship","rocket","satellite","spaceman"].forEach(name => scheduleApple(name));
  }

  function stopAllAppleTimers() {
    Object.values(apples).forEach(a => { if (a.timer) clearTimeout(a.timer); a.timer = null; });
  }

  function resetGame() {
    snake = [{ x: 10, y: 10 }];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    score = 0;
    started = false;
    gameOverFlag = false;
    paused = false;
    updateHud();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    gameStatusLine.style.display = "none";
    if (isTouchDevice()) {
      statusBarRow1.style.display = "flex";
      statusBarRow2.style.display = "flex";
    } else {
      statusBarCombined.style.display = "flex";
    }
    hideOverlay();
    clearInterval(gameInterval);
    stopAllAppleTimers();
    resetApples();
    gameInterval = setInterval(gameLoop, speed);
    setTimeout(() => canvas.focus(), 100);
  }

  function gameLoop() {
    if (!started || gameOverFlag || paused) return;
    direction = { ...nextDirection };
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
    if (
      head.x < 0 || head.x >= tileCount ||
      head.y < 0 || head.y >= tileCount ||
      snake.some(seg => seg.x === head.x && seg.y === head.y)
    ) {
      if (!sfxMuted) { crashSound.currentTime = 0; crashSound.play(); }
      gameOver();
      return;
    }
    snake.unshift(head);
    let ate = false;
    for (const name of Object.keys(apples)) {
      const apple = apples[name];
      if (apple.active && head.x === apple.x && head.y === apple.y) {
        if (name === "spaceman") {
          score = 0;
          updateHud();
          if (!sfxMuted) { spacemanSound.currentTime = 0; spacemanSound.play(); }
          apple.active = false;
          scheduleApple("spaceman");
          ate = true; break;
        } else if (name === "invader") {
          score += apple.points;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('spacerun_highscore', highScore);
          }
          if (!sfxMuted) { explosionSound.currentTime = 0; explosionSound.play(); }
          const {x, y} = getFreeCell();
          apple.x = x;
          apple.y = y;
          scheduleApple("invader");
          ate = true; break;
        } else {
          score += apple.points;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('spacerun_highscore', highScore);
          }
          if (!sfxMuted) {
            if (name === "alien") { alienSound.currentTime = 0; alienSound.play(); }
            if (name === "spaceship") { spaceshipSound.currentTime = 0; spaceshipSound.play(); }
            if (name === "rocket") { rocketSound.currentTime = 0; rocketSound.play(); }
            if (name === "satellite") { satelliteSound.currentTime = 0; satelliteSound.play(); }
          }
          apple.active = false;
          scheduleApple(name);
          ate = true; break;
        }
      }
    }
    if (!ate) snake.pop();
    updateHud();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${gridSize}px Orbitron`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    snake.forEach((seg, i) => {
      ctx.save();
      ctx.globalAlpha = i === 0 ? 1 : Math.abs(Math.sin((Date.now() + i * 100) / 30));
      ctx.fillText("✨", seg.x * gridSize + gridSize / 2, seg.y * gridSize + gridSize / 2);
      ctx.restore();
    });
    Object.values(apples).forEach(apple => {
      if (apple.active) {
        ctx.save();
        ctx.globalAlpha = Math.abs(Math.sin(Date.now() / 30));
        ctx.fillText(apple.emoji, apple.x * gridSize + gridSize / 2, apple.y * gridSize + gridSize / 2);
        ctx.restore();
      }
    });
  }

  function updateHud() {
    // Update both desktop and touch status bars
    scoreDisplay.textContent = "Score: " + score;
    highScoreDisplay.textContent = "High Score: " + highScore;
    if (isTouchDevice()) {
      document.getElementById("scoreDisplayTouch").textContent = "Score: " + score;
      document.getElementById("highScoreDisplayTouch").textContent = "High Score: " + highScore;
    }
  }
  function showOverlay(msg) {
    overlay.textContent = msg;
    overlay.style.display = "block";
    lastOverlayMsg = msg;
  }
  function hideOverlay() {
    overlay.style.display = "none";
    lastOverlayMsg = "";
  }
  function setDirection(newDir) {
    if (
      (newDir.x !== -direction.x || direction.x === 0) &&
      (newDir.y !== -direction.y || direction.y === 0)
    ) {
      nextDirection = newDir;
      started = true;
      if (!paused && !gameOverFlag) hideOverlay();
    }
  }
  function gameOver() {
    clearInterval(gameInterval);
    stopAllAppleTimers();
    finalScoreSpan.textContent = `Score: ${score}`;
    updateHud();
    if (isTouchDevice()) {
      statusBarRow1.style.display = "none";
      statusBarRow2.style.display = "none";
    } else {
      statusBarCombined.style.display = "none";
    }
    gameStatusLine.style.display = "flex";
    gameOverFlag = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showOverlay("GAME OVER");
    setTimeout(hideOverlay, 1800);
  }
  document.addEventListener("keydown", e => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(e.key)) {
      if (e.key === "ArrowUp" || e.key === "w") setDirection({ x: 0, y: -1 });
      if (e.key === "ArrowDown" || e.key === "s") setDirection({ x: 0, y: 1 });
      if (e.key === "ArrowLeft" || e.key === "a") setDirection({ x: -1, y: 0 });
      if (e.key === "ArrowRight" || e.key === "d") setDirection({ x: 1, y: 0 });
      canvas.focus();
    }
    if (e.key.toLowerCase() === "p") {
      togglePause();
    }
    if (gameOverFlag && e.key === "Enter") {
      resetGame();
    }
  });
  canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  });
  canvas.addEventListener('touchend', function(e) {
    if (touchStartX === undefined || touchStartY === undefined) return;
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 20) setDirection({ x: 1, y: 0 });
      if (dx < -20) setDirection({ x: -1, y: 0 });
    } else {
      if (dy > 20) setDirection({ x: 0, y: 1 });
      if (dy < -20) setDirection({ x: 0, y: -1 });
    }
    touchStartX = touchStartY = undefined;
  });

  // D-pad (touch) event bindings
  upBtn.onclick = e => setDirection({ x: 0, y: -1 });
  downBtn.onclick = e => setDirection({ x: 0, y: 1 });
  leftBtn.onclick = e => setDirection({ x: -1, y: 0 });
  rightBtn.onclick = e => setDirection({ x: 1, y: 0 });

  // Pause/other controls
  function bindButton(btn, clickFn) {
    if (btn) btn.onclick = clickFn;
  }
  // Both desktop/touch pause buttons
  bindButton(document.getElementById("pauseBtn"), togglePause);
  bindButton(document.getElementById("pauseBtnTouch"), togglePause);
  function togglePause() {
    if (gameOverFlag) return;
    let pb = isTouchDevice() ? document.getElementById("pauseBtnTouch") : document.getElementById("pauseBtn");
    pb.innerHTML = paused ? "⏸️" : "▶️";
    pb.setAttribute("aria-pressed", paused ? "false" : "true");
    paused = !paused;
    if (paused) {
      showOverlay("PAUSED");
    } else {
      hideOverlay();
    }
  }
  restartBtn.onclick = resetGame;
  // Mute
  bindButton(document.getElementById("muteBtn"), () => {
    sfxMuted = !sfxMuted;
    document.getElementById("muteBtn").textContent = sfxMuted ? "🔇" : "🔊";
    if (document.getElementById("muteBtnTouch"))
      document.getElementById("muteBtnTouch").textContent = sfxMuted ? "🔇" : "🔊";
  });
  bindButton(document.getElementById("muteBtnTouch"), () => {
    sfxMuted = !sfxMuted;
    document.getElementById("muteBtn").textContent = sfxMuted ? "🔇" : "🔊";
    document.getElementById("muteBtnTouch").textContent = sfxMuted ? "🔇" : "🔊";
  });
  // Speed
  document.getElementById("speedSelect").onchange = () => {
    speed = Number(document.getElementById("speedSelect").value);
    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, speed);
    document.getElementById("speedSelectTouch").value = speed + '';
  };
  document.getElementById("speedSelectTouch").onchange = () => {
    speed = Number(document.getElementById("speedSelectTouch").value);
    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, speed);
    document.getElementById("speedSelect").value = speed + '';
  };
  // Radio
  bindButton(document.getElementById("toggleRadio"), () => {
    if (radio.paused) {
      radio.play();
      document.getElementById("toggleRadio").textContent = "Radio OFF";
      if (document.getElementById("toggleRadioTouch"))
        document.getElementById("toggleRadioTouch").textContent = "Radio OFF";
    } else {
      radio.pause();
      document.getElementById("toggleRadio").textContent = "Radio ON";
      if (document.getElementById("toggleRadioTouch"))
        document.getElementById("toggleRadioTouch").textContent = "Radio ON";
    }
  });
  bindButton(document.getElementById("toggleRadioTouch"), () => {
    if (radio.paused) {
      radio.play();
      document.getElementById("toggleRadio").textContent = "Radio OFF";
      document.getElementById("toggleRadioTouch").textContent = "Radio OFF";
    } else {
      radio.pause();
      document.getElementById("toggleRadio").textContent = "Radio ON";
      document.getElementById("toggleRadioTouch").textContent = "Radio ON";
    }
  });
  // Login
  bindButton(document.getElementById("loginBtn"), () => { loginPopup.style.display = "block"; });
  bindButton(document.getElementById("loginBtnTouch"), () => { loginPopup.style.display = "block"; });

  canvas.onclick = () => canvas.focus();
  function resizeCanvas() {
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  window.addEventListener('focus', () => {
    if (paused && lastOverlayMsg !== "PAUSED") showOverlay("PAUSED");
  });
  updateHud();
  resetGame();
}
</script>
</body>
</html>
