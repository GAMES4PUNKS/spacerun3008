<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPACERUN3008 – Listen & Play</title>
  <script src="https://telegram.org/js/games.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url('bgobe.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    canvas {
      width: 90vmin;
      height: 90vmin;
      max-width: 90vw;
      max-height: 90vw;
      background: url('moshed-2021-11-29-0-39-58.gif') center/cover no-repeat;
      display: block;
      box-shadow: 0 0 20px #a020f0;
      margin: 1rem auto;
      outline: none;
      position: relative;
      z-index: 1;
    }
    #statusBar {
      font-size: 1rem;
      color: white;
      margin-bottom: 0.5rem;
      z-index: 3;
    }
    #scoreDisplay {
      font-size: 1.2rem;
      margin-right: 1.5rem;
    }
    #highScoreDisplay {
      font-size: 1.2rem;
      margin-left: 1.5rem;
      color: #a0ffd0;
    }
    #gameStatusLine {
      display: none;
      margin-top: 0.5rem;
      font-size: 1rem;
      color: white;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      z-index: 4;
      position: relative;
    }
    #finalScore {
      margin: 0 0.3rem;
      color: white;
    }
    #restartBtn, #toggleRadio, #loginBtn, #pauseBtn, #muteBtn {
      background: none;
      font-size: 1rem;
      font-family: 'Orbitron', sans-serif;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      animation: pulse 1.5s infinite ease-in-out;
      margin: 0 0.3rem;
    }
    #speedSelect {
      background: #181818;
      color: white;
      border-radius: 6px;
      border: 1px solid #a020f0;
      padding: 0.1rem 0.5rem;
      font-family: 'Orbitron', sans-serif;
      margin-left: 0.5rem;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }
    a.leaderboard-link {
      color: white;
      text-decoration: underline;
      font-size: 1rem;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.1; }
      100% { opacity: 1; }
    }
    #loginPopup {
      display: none;
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      border: 1px solid #888;
      padding: 1rem;
      border-radius: 10px;
      color: white;
      z-index: 20;
      min-width: 250px;
    }
    #loginPopup button {
      margin: 0.5rem;
      font-size: 1rem;
      background: #333;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    #closeLoginPopup {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 18px;
      color: white;
      cursor: pointer;
    }
    #overlay {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      border-radius: 16px;
      font-size: 2rem;
      z-index: 5;
      padding: 2rem 3rem;
      pointer-events: none;
    }
    #controls {
      display: none;
      position: relative;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 0.7rem;
      pointer-events: none;
      user-select: none;
      background: none;
    }
    .show-dpad #controls {
      display: flex;
    }
    #dpad {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }
    .dpad-btn {
      position: absolute;
      width: 65px;
      height: 65px;
      background: rgba(255,255,255,0.18);
      border: 2px solid #fff;
      color: #fff;
      font-size: 2rem;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 10px #a0ffd080;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: all;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.15s;
      z-index: 1;
    }
    .dpad-btn:active {
      background: #a020f0;
    }
    #upBtn    { top: 0;   left: 50%; transform: translate(-50%, 0); }
    #downBtn  { bottom: 0; left: 50%; transform: translate(-50%, 0);}
    #leftBtn  { top: 50%;  left: 0;   transform: translate(0, -50%);}
    #rightBtn { top: 50%;  right: 0;  transform: translate(0, -50%);}
    #pauseDpadBtn {
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      background: rgba(255,255,255,0.32);
      border: 2px solid #a020f0;
      color: #fff;
      box-shadow: 0 0 16px #a020f0;
      z-index: 2;
    }
    .visually-hidden {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px 1px 1px 1px);
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }
    @media (max-width: 550px) {
      #controls, #dpad {
        width: 160px;
        height: 160px;
      }
      .dpad-btn {
        width: 46px;
        height: 46px;
        font-size: 1.2rem;
      }
    }
    .show-dpad #pauseBtn {
      display: none !important;
    }
  </style>
</head>
<body>
<div style="position:relative;">
  <canvas id="gameCanvas" tabindex="0" aria-label="Snake game"></canvas>
  <div id="overlay"></div>
</div>
<div id="controls" aria-label="Game Controller">
  <div id="dpad">
    <button id="upBtn"    class="dpad-btn" aria-label="Move Up">↑</button>
    <button id="downBtn"  class="dpad-btn" aria-label="Move Down">↓</button>
    <button id="leftBtn"  class="dpad-btn" aria-label="Move Left">←</button>
    <button id="rightBtn" class="dpad-btn" aria-label="Move Right">→</button>
    <button id="pauseDpadBtn" class="dpad-btn" aria-label="Pause/Resume">⏯️</button>
  </div>
</div>
<div id="statusBar">
  <span id="scoreDisplay">Score: 0</span>
  <span id="highScoreDisplay">High Score: 0</span>
  <button id="pauseBtn" aria-pressed="false" title="Pause/Resume">⏸️</button>
  <button id="muteBtn" aria-pressed="false" title="Mute/Unmute SFX">🔊</button>
  <label for="speedSelect" class="visually-hidden">Game Speed</label>
  <select id="speedSelect" title="Game Speed">
    <option value="250">Normal</option>
    <option value="120">Fast</option>
    <option value="60">Turbo</option>
  </select>
  <button id="toggleRadio" aria-pressed="false">Radio ON</button>
  <button id="loginBtn">LOG IN</button>
</div>
<div id="gameStatusLine" aria-live="polite">
  <span>Game over.</span>
  <span id="finalScore">Score: 0</span>
  <button id="restartBtn">Play Again</button>
  <a href="https://games4punks.github.io/spacerun3008/leaderboard.html" class="leaderboard-link" target="_blank" rel="noopener noreferrer">View Leaderboard</a>
</div>
<div id="loginPopup" aria-modal="true" role="dialog">
  <span id="closeLoginPopup" tabindex="0" aria-label="Close login popup">&times;</span>
  <p>Select WAX Wallet</p>
  <button onclick="alert('Login with Anchor')">Anchor</button>
  <button onclick="alert('Login with MyCloud')">MyCloud</button>
  <button onclick="alert('Login with Wombat')">Wombat</button>
</div>
<audio id="radioStream" loop>
  <source src="http://stream.radiojar.com/2qm1fc5kb" type="audio/mpeg">
</audio>
<audio id="explosionSound" src="explosion.mp3"></audio>
<audio id="crashSound" src="crash.mp3"></audio>
<audio id="spaceshipSound" src="spaceship.mp3"></audio>
<audio id="alienSound" src="alien.mp3"></audio>
<audio id="rocketSound" src="rocket.mp3"></audio>
<audio id="satelliteSound" src="satellite.mp3"></audio>
<audio id="spacemanSound" src="spaceman.mp3"></audio>
<script>
window.onload = function() {
  // --- Variables ---
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = 400;
  canvas.height = 400;
  const gridSize = 20;
  const tileCount = canvas.width / gridSize;
  let snake = [{ x: 10, y: 10 }];
  let direction = { x: 0, y: 0 };
  let nextDirection = { x: 0, y: 0 };
  let score = 0;
  let highScore = Number(localStorage.getItem('spacerun_highscore') || "0");
  let started = false;
  let paused = false;
  let gameInterval, speed = 250;
  let gameOverFlag = false;
  let sfxMuted = false;
  let touchStartX, touchStartY;
  let lastOverlayMsg = "";
  const statusBar = document.getElementById("statusBar");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const highScoreDisplay = document.getElementById("highScoreDisplay");
  const gameStatusLine = document.getElementById("gameStatusLine");
  const finalScoreSpan = document.getElementById("finalScore");
  const restartBtn = document.getElementById("restartBtn");
  const radio = document.getElementById("radioStream");
  const toggleRadioBtn = document.getElementById("toggleRadio");
  const explosionSound = document.getElementById("explosionSound");
  const crashSound = document.getElementById("crashSound");
  const spaceshipSound = document.getElementById("spaceshipSound");
  const alienSound = document.getElementById("alienSound");
  const rocketSound = document.getElementById("rocketSound");
  const satelliteSound = document.getElementById("satelliteSound");
  const spacemanSound = document.getElementById("spacemanSound");
  const loginPopup = document.getElementById("loginPopup");
  const loginBtn = document.getElementById("loginBtn");
  const closeLoginPopup = document.getElementById("closeLoginPopup");
  const pauseBtn = document.getElementById("pauseBtn");
  const muteBtn = document.getElementById("muteBtn");
  const speedSelect = document.getElementById("speedSelect");
  const overlay = document.getElementById("overlay");
  const upBtn = document.getElementById("upBtn");
  const downBtn = document.getElementById("downBtn");
  const leftBtn = document.getElementById("leftBtn");
  const rightBtn = document.getElementById("rightBtn");
  const pauseDpadBtn = document.getElementById("pauseDpadBtn");
  explosionSound.volume = 0.5;
  crashSound.volume = 0.5;
  spaceshipSound.volume = 0.5;
  alienSound.volume = 0.5;
  rocketSound.volume = 0.5;
  satelliteSound.volume = 0.5;
  spacemanSound.volume = 0.5;
  function isTouchDevice() {
    return (
      'ontouchstart' in window ||
      (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) ||
      (navigator.msMaxTouchPoints && navigator.msMaxTouchPoints > 0)
    );
  }
  if (isTouchDevice()) {
    document.body.classList.add('show-dpad');
  }

  // --- Apples Data ---
  // Main invader apple is static; others move.
  let apples = [
    { // Main invader apple (static)
      x: 5, y: 5, emoji: "👾", moveTimer: null, moveInterval: 0, points: 25, sound: explosionSound, type: "main"
    },
    { // Spaceship
      x: 8, y: 8, emoji: "🛸", moveTimer: null, moveInterval: 1000, points: 10, sound: spaceshipSound, type: "spaceship"
    },
    { // Alien
      x: 2, y: 15, emoji: "👽", moveTimer: null, moveInterval: 1500, points: 20, sound: alienSound, type: "alien"
    },
    { // Rocket
      x: 16, y: 7, emoji: "🚀", moveTimer: null, moveInterval: 700, points: 5, sound: rocketSound, type: "rocket"
    },
    { // Satellite
      x: 11, y: 3, emoji: "🛰️", moveTimer: null, moveInterval: 900, points: 3, sound: satelliteSound, type: "satellite"
    },
    { // Spaceman (score resets!)
      x: 14, y: 12, emoji: "🧑‍🚀", moveTimer: null, moveInterval: 600, points: 0, sound: spacemanSound, type: "spaceman"
    }
  ];

  function isCellFree(x, y, ignoreIdx=-1) {
    if (snake.some(seg => seg.x === x && seg.y === y)) return false;
    for (let i=0; i<apples.length; ++i) {
      if (i === ignoreIdx) continue;
      if (apples[i].x === x && apples[i].y === y) return false;
    }
    return true;
  }
  function getMovingAppleTarget(idx) {
    const head = snake[0];
    const apple = apples[idx];
    let bestDist = -1, best = {x: apple.x, y: apple.y};
    for (const dir of [
      {x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0},
      {x:-1,y:-1},{x:1,y:-1},{x:-1,y:1},{x:1,y:1}
    ]) {
      const nx = apple.x + dir.x, ny = apple.y + dir.y;
      if (nx < 0 || ny < 0 || nx >= tileCount || ny >= tileCount) continue;
      if (!isCellFree(nx, ny, idx)) continue;
      let dist = Math.abs(nx-head.x) + Math.abs(ny-head.y);
      if (apple.type === "spaceman") dist += 2;
      if (dist > bestDist) {
        bestDist = dist;
        best = {x: nx, y: ny};
      }
    }
    return best;
  }
  function moveApple(idx) {
    const apple = apples[idx];
    if (apple.type === "main") return; // Main apple never moves!
    const {x, y} = getMovingAppleTarget(idx);
    apple.x = x;
    apple.y = y;
    startAppleTimer(idx);
  }
  function startAppleTimer(idx) {
    const apple = apples[idx];
    if (apple.moveTimer) clearTimeout(apple.moveTimer);
    if (apple.type === "main") return;
    let interval = apple.type === "spaceman"
      ? 2000 + Math.floor(Math.random()*800)
      : apple.moveInterval + Math.floor(Math.random()*1000);
    apple.moveTimer = setTimeout(() => moveApple(idx), interval);
  }
  function stopAllAppleTimers() {
    apples.forEach(a => { if (a.moveTimer) clearTimeout(a.moveTimer); a.moveTimer = null; });
  }
  function resetApples() {
    for (let i=0;i<apples.length;++i) {
      let tries = 0;
      do {
        apples[i].x = Math.floor(Math.random() * tileCount);
        apples[i].y = Math.floor(Math.random() * tileCount);
        tries++;
      } while ((!isCellFree(apples[i].x, apples[i].y, i) || (Math.abs(apples[i].x-10)+Math.abs(apples[i].y-10)<8)) && tries < 1000);
      startAppleTimer(i);
    }
  }

  function resetGame() {
    snake = [{ x: 10, y: 10 }];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    score = 0;
    started = false;
    gameOverFlag = false;
    paused = false;
    updateHud();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    gameStatusLine.style.display = "none";
    statusBar.style.display = "block";
    hideOverlay();
    clearInterval(gameInterval);
    stopAllAppleTimers();
    resetApples();
    gameInterval = setInterval(gameLoop, speed);
    setTimeout(() => canvas.focus(), 100);
  }
  function gameLoop() {
    if (!started || gameOverFlag || paused) return;
    direction = { ...nextDirection };
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
    if (
      head.x < 0 || head.x >= tileCount ||
      head.y < 0 || head.y >= tileCount ||
      snake.some(seg => seg.x === head.x && seg.y === head.y)
    ) {
      if (!sfxMuted) { crashSound.currentTime = 0; crashSound.play(); }
      gameOver();
      return;
    }
    snake.unshift(head);
    let ate = false;
    for (let i=0;i<apples.length;++i) {
      const apple = apples[i];
      if (head.x === apple.x && head.y === apple.y) {
        if (apple.type === "spaceman") {
          score = 0;
          updateHud();
          if (!sfxMuted) { apple.sound.currentTime = 0; apple.sound.play(); }
          moveApple(i); // jump away instantly
          ate = true;
          break;
        } else {
          score += apple.points;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('spacerun_highscore', highScore);
          }
          if (!sfxMuted) { apple.sound.currentTime = 0; apple.sound.play(); }
          moveApple(i); // jump away instantly (except main apple)
          ate = true;
          break;
        }
      }
    }
    if (!ate) snake.pop();
    updateHud();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${gridSize}px Orbitron`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    snake.forEach((seg, i) => {
      ctx.save();
      ctx.globalAlpha = i === 0 ? 1 : Math.abs(Math.sin((Date.now() + i * 100) / 30));
      ctx.fillText("✨", seg.x * gridSize + gridSize / 2, seg.y * gridSize + gridSize / 2);
      ctx.restore();
    });
    apples.forEach(apple => {
      ctx.save();
      ctx.globalAlpha = Math.abs(Math.sin(Date.now() / 30));
      ctx.fillText(apple.emoji, apple.x * gridSize + gridSize / 2, apple.y * gridSize + gridSize / 2);
      ctx.restore();
    });
  }
  function updateHud() {
    scoreDisplay.textContent = "Score: " + score;
    highScoreDisplay.textContent = "High Score: " + highScore;
  }
  function showOverlay(msg) {
    overlay.textContent = msg;
    overlay.style.display = "block";
    lastOverlayMsg = msg;
  }
  function hideOverlay() {
    overlay.style.display = "none";
    lastOverlayMsg = "";
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === "Escape" && loginPopup.style.display === 'block') {
      loginPopup.style.display = 'none';
    }
  });
  loginBtn.onclick = () => {
    loginPopup.style.display = 'block';
    closeLoginPopup.focus();
  };
  closeLoginPopup.onclick = () => {
    loginPopup.style.display = 'none';
  };
  closeLoginPopup.addEventListener('keydown', e => {
    if (e.key === "Enter" || e.key === " ") {
      loginPopup.style.display = 'none';
    }
  });
  window.onclick = function(event) {
    if (event.target === loginPopup) {
      loginPopup.style.display = 'none';
    }
  };
  function setDirection(newDir) {
    if (
      (newDir.x !== -direction.x || direction.x === 0) &&
      (newDir.y !== -direction.y || direction.y === 0)
    ) {
      nextDirection = newDir;
      started = true;
      if (!paused && !gameOverFlag) hideOverlay();
    }
  }
  function gameOver() {
    clearInterval(gameInterval);
    stopAllAppleTimers();
    finalScoreSpan.textContent = `Score: ${score}`;
    updateHud();
    statusBar.style.display = "none";
    gameStatusLine.style.display = "flex";
    gameOverFlag = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showOverlay("GAME OVER");
    setTimeout(hideOverlay, 1800);
  }
  document.addEventListener("keydown", e => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(e.key)) {
      if (e.key === "ArrowUp" || e.key === "w") setDirection({ x: 0, y: -1 });
      if (e.key === "ArrowDown" || e.key === "s") setDirection({ x: 0, y: 1 });
      if (e.key === "ArrowLeft" || e.key === "a") setDirection({ x: -1, y: 0 });
      if (e.key === "ArrowRight" || e.key === "d") setDirection({ x: 1, y: 0 });
      canvas.focus();
    }
    if (e.key.toLowerCase() === "p") {
      togglePause();
    }
    if (gameOverFlag && e.key === "Enter") {
      resetGame();
    }
  });
  canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  });
  canvas.addEventListener('touchend', function(e) {
    if (touchStartX === undefined || touchStartY === undefined) return;
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 20) setDirection({ x: 1, y: 0 });
      if (dx < -20) setDirection({ x: -1, y: 0 });
    } else {
      if (dy > 20) setDirection({ x: 0, y: 1 });
      if (dy < -20) setDirection({ x: 0, y: -1 });
    }
    touchStartX = touchStartY = undefined;
  });
  upBtn.onclick = e => setDirection({ x: 0, y: -1 });
  downBtn.onclick = e => setDirection({ x: 0, y: 1 });
  leftBtn.onclick = e => setDirection({ x: -1, y: 0 });
  rightBtn.onclick = e => setDirection({ x: 1, y: 0 });
  pauseDpadBtn.onclick = togglePause;
  pauseBtn.onclick = togglePause;
  function togglePause() {
    if (gameOverFlag) return;
    paused = !paused;
    pauseBtn.innerHTML = paused ? "▶️" : "⏸️";
    pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
    pauseDpadBtn.innerHTML = paused ? "▶️" : "⏯️";
    if (paused) {
      showOverlay("PAUSED");
    } else {
      hideOverlay();
    }
  }
  restartBtn.onclick = resetGame;
  toggleRadioBtn.onclick = () => {
    if (radio.paused) {
      radio.play();
      toggleRadioBtn.textContent = "Radio OFF";
      toggleRadioBtn.setAttribute("aria-pressed", "true");
    } else {
      radio.pause();
      toggleRadioBtn.textContent = "Radio ON";
      toggleRadioBtn.setAttribute("aria-pressed", "false");
    }
  };
  muteBtn.onclick = () => {
    sfxMuted = !sfxMuted;
    muteBtn.textContent = sfxMuted ? "🔇" : "🔊";
    muteBtn.setAttribute("aria-pressed", sfxMuted ? "true" : "false");
  };
  speedSelect.value = speed + '';
  speedSelect.onchange = () => {
    speed = Number(speedSelect.value);
    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, speed);
  };
  canvas.onclick = () => canvas.focus();
  function resizeCanvas() {
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  window.addEventListener('focus', () => {
    if (paused && lastOverlayMsg !== "PAUSED") showOverlay("PAUSED");
  });
  updateHud();
  resetGame();
}
</script>
</body>
</html>
