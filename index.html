<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPACERUN3008 – Listen & Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url('bgobe.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    canvas {
      width: 90vmin;
      height: 90vmin;
      max-width: 90vw;
      max-height: 90vw;
      background: url('moshed-2021-11-29-0-39-58.gif') center/cover no-repeat;
      display: block;
      box-shadow: 0 0 20px #a020f0;
      margin: 1rem auto 0 auto;
      outline: none;
      position: relative;
      z-index: 1;
    }
    #touchpad {
      display: none; /* default is hidden, shown via .show-touchpad */
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 10;
      background: rgba(160,32,240,0.07);
      /* To not block top status bar or overlays, pointer-events: auto on touch only */
      pointer-events: none;
      user-select: none;
      touch-action: none;
    }
    .show-touchpad #touchpad {
      display: block;
      pointer-events: auto;
    }
    #touchpad.active {
      background: rgba(160,32,240,0.16);
    }
    #touchpadLabel {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 1px;
      opacity: 0.7;
      pointer-events: none;
      user-select: none;
    }
    #statusBar {
      font-size: 1rem;
      color: white;
      margin-bottom: 0.5rem;
      z-index: 3;
    }
    #scoreDisplay {
      font-size: 1.2rem;
      margin-right: 1.5rem;
    }
    #highScoreDisplay {
      font-size: 1.2rem;
      margin-left: 1.5rem;
      color: #a0ffd0;
    }
    #gameStatusLine {
      display: none;
      margin-top: 0.5rem;
      font-size: 1rem;
      color: white;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      z-index: 4;
      position: relative;
    }
    #finalScore {
      margin: 0 0.3rem;
      color: white;
    }
    #restartBtn, #toggleRadio, #loginBtn, #pauseBtn, #muteBtn {
      background: none;
      font-size: 1rem;
      font-family: 'Orbitron', sans-serif;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      animation: pulse 1.5s infinite ease-in-out;
      margin: 0 0.3rem;
    }
    #speedSelect {
      background: #181818;
      color: white;
      border-radius: 6px;
      border: 1px solid #a020f0;
      padding: 0.1rem 0.5rem;
      font-family: 'Orbitron', sans-serif;
      margin-left: 0.5rem;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }
    a.leaderboard-link {
      color: white;
      text-decoration: underline;
      font-size: 1rem;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.1; }
      100% { opacity: 1; }
    }
    #loginPopup {
      display: none;
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      border: 1px solid #888;
      padding: 1rem;
      border-radius: 10px;
      color: white;
      z-index: 20;
      min-width: 250px;
    }
    #loginPopup button {
      margin: 0.5rem;
      font-size: 1rem;
      background: #333;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    #closeLoginPopup {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 18px;
      color: white;
      cursor: pointer;
    }
    #overlay {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      border-radius: 16px;
      font-size: 2rem;
      z-index: 5;
      padding: 2rem 3rem;
      pointer-events: none;
    }
    .visually-hidden {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px 1px 1px 1px);
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }
    @media (max-width: 550px) {
      #touchpadLabel {
        font-size: 1rem;
        top: 58%;
      }
    }
  </style>
</head>
<body>
<div style="position:relative;">
  <canvas id="gameCanvas" tabindex="0" aria-label="Snake game"></canvas>
  <div id="overlay"></div>
</div>
<!-- Touchpad area for swipe movement, only on touch devices -->
<div id="touchpad"><span id="touchpadLabel">Swipe anywhere to control</span></div>

<div id="statusBar">
  <span id="scoreDisplay">Score: 0</span>
  <span id="highScoreDisplay">High Score: 0</span>
  <button id="pauseBtn" aria-pressed="false" title="Pause/Resume">⏸️</button>
  <button id="muteBtn" aria-pressed="false" title="Mute/Unmute SFX">🔊</button>
  <label for="speedSelect" class="visually-hidden">Game Speed</label>
  <select id="speedSelect" title="Game Speed">
    <option value="250">Normal</option>
    <option value="120">Fast</option>
    <option value="60">Turbo</option>
  </select>
  <button id="toggleRadio" aria-pressed="false">Radio ON</button>
  <button id="loginBtn">LOG IN</button>
</div>
<div id="gameStatusLine" aria-live="polite">
  <span>Game over.</span>
  <span id="finalScore">Score: 0</span>
  <button id="restartBtn">Play Again</button>
  <a href="https://games4punks.github.io/spacerun3008/leaderboard.html" class="leaderboard-link" target="_blank" rel="noopener noreferrer">View Leaderboard</a>
</div>
<div id="loginPopup" aria-modal="true" role="dialog">
  <span id="closeLoginPopup" tabindex="0" aria-label="Close login popup">&times;</span>
  <p>Select WAX Wallet</p>
  <button onclick="alert('Login with Anchor')">Anchor</button>
  <button onclick="alert('Login with MyCloud')">MyCloud</button>
  <button onclick="alert('Login with Wombat')">Wombat</button>
</div>
<audio id="radioStream" loop>
  <source src="http://stream.radiojar.com/2qm1fc5kb" type="audio/mpeg">
</audio>
<audio id="explosionSound" src="explosion.mp3"></audio>
<audio id="crashSound" src="crash.mp3"></audio>
<audio id="spaceshipSound" src="spaceship.mp3"></audio>
<audio id="alienSound" src="alien.mp3"></audio>
<audio id="rocketSound" src="rocket.mp3"></audio>
<audio id="satelliteSound" src="satellite.mp3"></audio>
<audio id="spacemanSound" src="spaceman.mp3"></audio>
<script>
window.onload = function() {
  // Only show touchpad on touch devices
  function isTouchDevice() {
    return (
      'ontouchstart' in window ||
      (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) ||
      (navigator.msMaxTouchPoints && navigator.msMaxTouchPoints > 0)
    );
  }
  if (isTouchDevice()) {
    document.body.classList.add('show-touchpad');
  }

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = 400;
  canvas.height = 400;

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;
  let snake = [{ x: 10, y: 10 }];
  let direction = { x: 0, y: 0 };
  let nextDirection = { x: 0, y: 0 };
  let score = 0;
  let highScore = Number(localStorage.getItem('spacerun_highscore') || "0");
  let started = false;
  let paused = false;
  let gameInterval, speed = 250;
  let gameOverFlag = false;
  let sfxMuted = false;
  let lastOverlayMsg = "";

  const statusBar = document.getElementById("statusBar");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const highScoreDisplay = document.getElementById("highScoreDisplay");
  const gameStatusLine = document.getElementById("gameStatusLine");
  const finalScoreSpan = document.getElementById("finalScore");
  const restartBtn = document.getElementById("restartBtn");
  const radio = document.getElementById("radioStream");
  const toggleRadioBtn = document.getElementById("toggleRadio");
  const explosionSound = document.getElementById("explosionSound");
  const crashSound = document.getElementById("crashSound");
  const spaceshipSound = document.getElementById("spaceshipSound");
  const alienSound = document.getElementById("alienSound");
  const rocketSound = document.getElementById("rocketSound");
  const satelliteSound = document.getElementById("satelliteSound");
  const spacemanSound = document.getElementById("spacemanSound");
  const loginPopup = document.getElementById("loginPopup");
  const loginBtn = document.getElementById("loginBtn");
  const closeLoginPopup = document.getElementById("closeLoginPopup");
  const pauseBtn = document.getElementById("pauseBtn");
  const muteBtn = document.getElementById("muteBtn");
  const speedSelect = document.getElementById("speedSelect");
  const overlay = document.getElementById("overlay");
  const touchpad = document.getElementById("touchpad");

  explosionSound.volume = 0.5;
  crashSound.volume = 0.5;
  spaceshipSound.volume = 0.5;
  alienSound.volume = 0.5;
  rocketSound.volume = 0.5;
  satelliteSound.volume = 0.5;
  spacemanSound.volume = 0.5;

  // Apple configs for timing and points
  const appleConfigs = [
    { name: "invader", emoji: "👾", points: 25, minDelay: 5000, maxDelay: 12000 },
    { name: "alien", emoji: "👽", points: 20, minDelay: 16000, maxDelay: 30000 },
    { name: "spaceship", emoji: "🛸", points: 10, minDelay: 8000, maxDelay: 16000 },
    { name: "rocket", emoji: "🚀", points: 5, minDelay: 3000, maxDelay: 7000 },
    { name: "satellite", emoji: "🛰️", points: 3, minDelay: 2000, maxDelay: 5000 },
    { name: "spaceman", emoji: "🧑‍🚀", points: 0, minDelay: 2000, maxDelay: 8000 }
  ];

  let apples = {};
  appleConfigs.forEach(cfg => {
    apples[cfg.name] = {
      ...cfg,
      x: 0, y: 0,
      active: false,
      timer: null,
      visibleDuration: cfg.name === "spaceman" ? 2000 : null
    };
  });

  function getFreeCell() {
    let tries = 0;
    while (tries < 1000) {
      let x = Math.floor(Math.random() * tileCount);
      let y = Math.floor(Math.random() * tileCount);
      let clash = snake.some(seg => seg.x === x && seg.y === y) ||
        Object.values(apples).some(a => a.active && a.x === x && a.y === y);
      if (!clash) return {x, y};
      tries++;
    }
    return {x: 0, y: 0};
  }

  function spawnApple(name) {
    const apple = apples[name];
    const {x, y} = getFreeCell();
    apple.x = x;
    apple.y = y;
    apple.active = true;
    if (name === "spaceman") {
      if (apple.timer) clearTimeout(apple.timer);
      apple.timer = setTimeout(() => { apple.active = false; scheduleApple("spaceman"); }, apple.visibleDuration);
    } else if (name === "invader") {
      // Invader logic unchanged, handled by scheduleApple
    } else {
      // For all other apples, display for random time 2–7s
      if (apple.timer) clearTimeout(apple.timer);
      const visibleMs = 2000 + Math.random() * 5000; // 2s–7s
      apple.timer = setTimeout(() => {
        apple.active = false;
        scheduleApple(name);
      }, visibleMs);
    }
  }

  function scheduleApple(name) {
    const apple = apples[name];
    if (apple.timer) clearTimeout(apple.timer);
    let delay;
    if (name === "spaceman") {
      delay = apple.minDelay + Math.random() * (apple.maxDelay - apple.minDelay);
      apple.timer = setTimeout(() => spawnApple("spaceman"), delay);
    } else if (name === "invader") {
      delay = apple.minDelay + Math.random() * (apple.maxDelay - apple.minDelay);
      apple.timer = setTimeout(() => {
        if (apple.active) {
          const {x, y} = getFreeCell();
          apple.x = x;
          apple.y = y;
          scheduleApple("invader");
        }
      }, delay);
    } else {
      delay = apple.minDelay + Math.random() * (apple.maxDelay - apple.minDelay);
      apple.timer = setTimeout(() => spawnApple(name), delay);
    }
  }

  function resetApples() {
    Object.values(apples).forEach(apple => {
      apple.active = false;
      if (apple.timer) clearTimeout(apple.timer);
    });
    spawnApple("invader");
    scheduleApple("invader");
    ["alien","spaceship","rocket","satellite","spaceman"].forEach(name => scheduleApple(name));
  }

  function stopAllAppleTimers() {
    Object.values(apples).forEach(a => { if (a.timer) clearTimeout(a.timer); a.timer = null; });
  }

  function resetGame() {
    snake = [{ x: 10, y: 10 }];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    score = 0;
    started = false;
    gameOverFlag = false;
    paused = false;
    updateHud();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    gameStatusLine.style.display = "none";
    statusBar.style.display = "block";
    hideOverlay();
    clearInterval(gameInterval);
    stopAllAppleTimers();
    resetApples();
    gameInterval = setInterval(gameLoop, speed);
    setTimeout(() => canvas.focus(), 100);
  }

  function gameLoop() {
    if (!started || gameOverFlag || paused) return;
    direction = { ...nextDirection };
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
    if (
      head.x < 0 || head.x >= tileCount ||
      head.y < 0 || head.y >= tileCount ||
      snake.some(seg => seg.x === head.x && seg.y === head.y)
    ) {
      if (!sfxMuted) { crashSound.currentTime = 0; crashSound.play(); }
      gameOver();
      return;
    }
    snake.unshift(head);
    let ate = false;
    for (const name of Object.keys(apples)) {
      const apple = apples[name];
      if (apple.active && head.x === apple.x && head.y === apple.y) {
        if (name === "spaceman") {
          score = 0;
          updateHud();
          if (!sfxMuted) { spacemanSound.currentTime = 0; spacemanSound.play(); }
          apple.active = false;
          scheduleApple("spaceman");
          ate = true; break;
        } else if (name === "invader") {
          score += apple.points;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('spacerun_highscore', highScore);
          }
          if (!sfxMuted) { explosionSound.currentTime = 0; explosionSound.play(); }
          const {x, y} = getFreeCell();
          apple.x = x;
          apple.y = y;
          scheduleApple("invader");
          ate = true; break;
        } else {
          score += apple.points;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('spacerun_highscore', highScore);
          }
          if (!sfxMuted) {
            if (name === "alien") { alienSound.currentTime = 0; alienSound.play(); }
            if (name === "spaceship") { spaceshipSound.currentTime = 0; spaceshipSound.play(); }
            if (name === "rocket") { rocketSound.currentTime = 0; rocketSound.play(); }
            if (name === "satellite") { satelliteSound.currentTime = 0; satelliteSound.play(); }
          }
          apple.active = false;
          scheduleApple(name);
          ate = true; break;
        }
      }
    }
    if (!ate) snake.pop();
    updateHud();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${gridSize}px Orbitron`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    snake.forEach((seg, i) => {
      ctx.save();
      ctx.globalAlpha = i === 0 ? 1 : Math.abs(Math.sin((Date.now() + i * 100) / 30));
      ctx.fillText("✨", seg.x * gridSize + gridSize / 2, seg.y * gridSize + gridSize / 2);
      ctx.restore();
    });
    Object.values(apples).forEach(apple => {
      if (apple.active) {
        ctx.save();
        ctx.globalAlpha = Math.abs(Math.sin(Date.now() / 30));
        ctx.fillText(apple.emoji, apple.x * gridSize + gridSize / 2, apple.y * gridSize + gridSize / 2);
        ctx.restore();
      }
    });
  }

  function updateHud() {
    scoreDisplay.textContent = "Score: " + score;
    highScoreDisplay.textContent = "High Score: " + highScore;
  }
  function showOverlay(msg) {
    overlay.textContent = msg;
    overlay.style.display = "block";
    lastOverlayMsg = msg;
  }
  function hideOverlay() {
    overlay.style.display = "none";
    lastOverlayMsg = "";
  }
  function setDirection(newDir) {
    // Classic snake: block instant reversal except when stopped (direction.x/y === 0)
    if (
      (newDir.x !== -direction.x || direction.x === 0) &&
      (newDir.y !== -direction.y || direction.y === 0)
    ) {
      nextDirection = newDir;
      started = true;
      if (!paused && !gameOverFlag) hideOverlay();
    }
  }
  function gameOver() {
    clearInterval(gameInterval);
    stopAllAppleTimers();
    finalScoreSpan.textContent = `Score: ${score}`;
    updateHud();
    statusBar.style.display = "none";
    gameStatusLine.style.display = "flex";
    gameOverFlag = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showOverlay("GAME OVER");
    setTimeout(hideOverlay, 1800);
  }
  document.addEventListener("keydown", e => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(e.key)) {
      if (e.key === "ArrowUp" || e.key === "w") setDirection({ x: 0, y: -1 });
      if (e.key === "ArrowDown" || e.key === "s") setDirection({ x: 0, y: 1 });
      if (e.key === "ArrowLeft" || e.key === "a") setDirection({ x: -1, y: 0 });
      if (e.key === "ArrowRight" || e.key === "d") setDirection({ x: 1, y: 0 });
      canvas.focus();
    }
    if (e.key.toLowerCase() === "p") {
      togglePause();
    }
    if (gameOverFlag && e.key === "Enter") {
      resetGame();
    }
  });

  // --- Touchpad swipe logic (only if shown) ---
  if (document.body.classList.contains('show-touchpad')) {
    let padStartX, padStartY, padActive = false;
    touchpad.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        padStartX = e.touches[0].clientX;
        padStartY = e.touches[0].clientY;
        padActive = true;
        touchpad.classList.add('active');
      }
    });
    touchpad.addEventListener('touchmove', function(e) {
      // Prevent scrolling
      if (padActive) e.preventDefault();
    }, { passive: false });
    touchpad.addEventListener('touchend', function(e) {
      if (!padActive) return;
      let dx = e.changedTouches[0].clientX - padStartX;
      let dy = e.changedTouches[0].clientY - padStartY;
      if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 20) setDirection({ x: 1, y: 0 });
          if (dx < -20) setDirection({ x: -1, y: 0 });
        } else {
          if (dy > 20) setDirection({ x: 0, y: 1 });
          if (dy < -20) setDirection({ x: 0, y: -1 });
        }
      }
      padActive = false;
      touchpad.classList.remove('active');
    });
  }

  pauseBtn.onclick = togglePause;
  function togglePause() {
    if (gameOverFlag) return;
    paused = !paused;
    pauseBtn.innerHTML = paused ? "▶️" : "⏸️";
    pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
    if (paused) {
      showOverlay("PAUSED");
    } else {
      hideOverlay();
    }
  }
  restartBtn.onclick = resetGame;
  toggleRadioBtn.onclick = () => {
    if (radio.paused) {
      radio.play();
      toggleRadioBtn.textContent = "Radio OFF";
      toggleRadioBtn.setAttribute("aria-pressed", "true");
    } else {
      radio.pause();
      toggleRadioBtn.textContent = "Radio ON";
      toggleRadioBtn.setAttribute("aria-pressed", "false");
    }
  };
  muteBtn.onclick = () => {
    sfxMuted = !sfxMuted;
    muteBtn.textContent = sfxMuted ? "🔇" : "🔊";
    muteBtn.setAttribute("aria-pressed", sfxMuted ? "true" : "false");
  };
  speedSelect.value = speed + '';
  speedSelect.onchange = () => {
    speed = Number(speedSelect.value);
    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, speed);
  };
  canvas.onclick = () => canvas.focus();
  window.addEventListener('focus', () => {
    if (paused && lastOverlayMsg !== "PAUSED") showOverlay("PAUSED");
  });
  updateHud();
  resetGame();
}
</script>
</body>
</html>
